[package]
name = "mjmx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for the mjmx MJML-to-HTML compiler."

[features]
default = []
# Build the binary with HTTP `<mj-include>` support, unlocking
# `--allow-http-includes`. Off by default so the shipped CLI is offline.
http-loader = ["mjmx/http-loader"]

[[bin]]
name = "mjmx"
path = "src/main.rs"

[dependencies]
mjmx.workspace = true
mjmx-dev-server.workspace = true
mjmx-language-server.workspace = true
clap.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
