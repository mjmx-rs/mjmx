[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# `benches/perf` is a standalone project with its own `[workspace]` and a heavy `mrml`
# dev dependency; keep it out of `cargo build --workspace` / `make ci`.
exclude = ["benches/perf"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mjmx-rs/mjmx"
authors = ["ryeasin03 <ryeasin03@gmail.com>"]

[workspace.dependencies]
mjmx-allocator = { version = "0.1.0", path = "crates/mjmx-allocator" }
mjmx-span = { version = "0.1.0", path = "crates/mjmx-span" }
mjmx-diagnostics = { version = "0.1.0", path = "crates/mjmx-diagnostics" }
mjmx-syntax = { version = "0.1.0", path = "crates/mjmx-syntax" }
mjmx-index = { version = "0.1.0", path = "crates/mjmx-index" }
mjmx-ast = { version = "0.1.0", path = "crates/mjmx-ast" }
mjmx-parser = { version = "0.1.0", path = "crates/mjmx-parser" }
mjmx-semantic = { version = "0.1.0", path = "crates/mjmx-semantic" }
mjmx-codegen = { version = "0.1.0", path = "crates/mjmx-codegen" }
mjmx-sourcemap = { version = "0.1.0", path = "crates/mjmx-sourcemap" }
mjmx-linter = { version = "0.1.0", path = "crates/mjmx-linter" }
mjmx-traverse = { version = "0.1.0", path = "crates/mjmx-traverse" }
mjmx-transformer = { version = "0.1.0", path = "crates/mjmx-transformer" }
mjmx-html-tokenizer = { version = "0.1.0", path = "crates/mjmx-html-tokenizer" }
mjmx-html-compare = { version = "0.1.0", path = "crates/mjmx-html-compare" }
mjmx-css-inline = { version = "0.1.0", path = "crates/mjmx-css-inline" }
mjmx-minifier = { version = "0.1.0", path = "crates/mjmx-minifier" }
mjmx-formatter = { version = "0.1.0", path = "crates/mjmx-formatter" }
mjmx-dev-server = { version = "0.1.0", path = "crates/mjmx-dev-server" }
mjmx-language-server = { version = "0.1.0", path = "crates/mjmx-language-server" }
mjmx-napi = { version = "0.1.0", path = "crates/mjmx-napi" }
mjmx-wasm = { version = "0.1.0", path = "crates/mjmx-wasm" }
mjmx ={ version = "0.1.0", path = "crates/mjmx" }
bumpalo = { version = "3", features = ["collections", "boxed"] }
# CSS Syntax Level 3 tokenizer/parser, behind `mjmx-minifier`'s opt-in `minifyCSS`
# pass (see `crates/mjmx-minifier/src/css.rs`). Chosen over a full optimizer:
# lightningcss does not build for wasm32-unknown-unknown (getrandom via ahash) and
# costs +3.68 MB, where this costs +42 KiB on the shipped, wasm-opt'd artifact.
# Default features off: `fast_match_byte` (cssparser-macros) and `fast_match_color`
# (phf, a named-color table this crate never queries) only trade size for tokenizer
# speed that an opt-in pass over an email's few KB of CSS cannot notice.
cssparser = { version = "0.37", default-features = false }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal"] }
# Default features off: the dev-server serves one HTML route, one JSON route and the
# hot-reload websocket, so `form`, `matched-path`, `original-uri` and axum's `tracing`
# integration are dead weight it would otherwise compile on every build.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "ws",
] }
notify = "8"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
napi-build = "2"
# Only for the N-API binding, to receive mjml's `fonts` object with its key order
# intact (see `crates/mjmx-napi/Cargo.toml`).
indexmap = "2"
# Pinned exactly: the `wasm-bindgen-cli` used by `make wasm` must be the same
# version as this crate dependency or code generation refuses to run.
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
# Blocking HTTP client behind `mjmx-transformer`'s optional `http-loader` feature.
# Blocking (not async) because include resolution is a synchronous AST pass; `gzip`
# and `json` are off since partials are small and we only ever read text bodies.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# The shipped WebAssembly artifact, built by `make wasm`. Separate from `release` because
# the two want opposite things: a native build optimises for speed, while every byte of
# the wasm is downloaded by the page that uses it.
#
# Measured on this workspace, post `wasm-opt -Oz`: `opt-level = "z"` is 460,277 B against
# `3`'s 609,711 B — 24.5% smaller — for a 24% slower render (22.3 → 27.5 µs/render in
# node), which still leaves it an order of magnitude ahead of mjml itself. `panic =
# "abort"` and `lto = "fat"` were measured too and together saved 724 bytes, so they are
# not set: not worth losing unwind info and build time over.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
