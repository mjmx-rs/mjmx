[package]
name = "mjmx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MJML-to-HTML compiler toolchain: parse and render MJML into responsive HTML."
readme = "README.md"
keywords = ["mjml", "email", "html", "compiler", "renderer"]
categories = ["email", "template-engine", "web-programming", "compilers"]

# Build docs with every feature on, so `http-loader`-gated items are documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Opt-in network access for `<mj-include path="https://…">`, exposed as
# `render_file_allow_http`. Off by default — see the security note in
# `mjmx_transformer::http`.
http-loader = ["mjmx-transformer/http-loader"]

[dependencies]
mjmx-allocator.workspace = true
mjmx-parser.workspace = true
mjmx-codegen.workspace = true
mjmx-linter.workspace = true
mjmx-transformer.workspace = true
mjmx-minifier.workspace = true
mjmx-css-inline.workspace = true
mjmx-formatter.workspace = true
mjmx-ast.workspace = true
mjmx-diagnostics.workspace = true

[dev-dependencies]
mjmx-html-compare.workspace = true

[lints]
workspace = true
