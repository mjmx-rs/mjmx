[package]
name = "mjmx-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebAssembly (wasm-bindgen) bindings for the mjmx MJML compiler."
# npm always renders `README.md` and cannot be pointed elsewhere, so that file is written
# for JavaScript consumers. Cargo's `readme` field *can* be redirected — point it at the
# crate-facing one so each registry gets the right audience.
readme = "README.crate.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mjmx.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[dev-dependencies]
# The options structs are deserialized by `serde-wasm-bindgen` at the JS boundary and
# by `serde_json` in the host-target conversion tests — the same `Deserialize` impls.
serde_json.workspace = true

[lints]
workspace = true
